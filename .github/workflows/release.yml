name: Release

# Publishes a release when a v* tag is pushed. Can also be run manually.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MAVEN_CENTRAL_USERNAME          Sonatype Central Portal user token name
#   MAVEN_CENTRAL_PASSWORD          Sonatype Central Portal user token password
#   SIGNING_IN_MEMORY_KEY           ASCII-armored GPG private key (in-memory, no secring.gpg needed)
#   SIGNING_IN_MEMORY_KEY_PASSWORD  passphrase for that key
#   JETBRAINS_MARKETPLACE_TOKEN     JetBrains Marketplace permanent token (for plugin publishing)
#
# These map to Gradle project properties via the ORG_GRADLE_PROJECT_ prefix, which the vanniktech
# maven-publish plugin and the IntelliJ plugin read. Config cache is disabled for publish/sign tasks
# (it conflicts with signing) — see PUBLISHING for details.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-maven-central:
    name: Publish libraries to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Stages a deployment to the Central Portal. Review and click "Publish" at
      # central.sonatype.com (Maven Central is immutable). To release automatically instead,
      # swap in publishAndReleaseToMavenCentral.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace

  publish-plugin:
    name: Publish plugin to JetBrains Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NOTE: the very first upload of a brand-new plugin must be done manually via the Marketplace
      # web UI. This job handles subsequent versions once the plugin is approved.
      - name: Publish plugin
        env:
          ORG_GRADLE_PROJECT_jetbrainsMarketplaceToken: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew :idea-plugin:publishPlugin --no-configuration-cache --stacktrace
