<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sight Web Graph Viewer</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
    .sidebar { border-right: 1px solid #333; overflow: hidden; display: flex; flex-direction: column; background: #1e1e1e; color: #d4d4d4; }
    .sidebar-top { padding: 12px; flex-shrink: 0; }
    .sidebar-heading { font-weight: 700; font-size: 15px; margin-bottom: 8px; color: #f0f0f0; }
    .sidebar-top select { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 6px; background: #2d2d2d; color: #d4d4d4; border: 1px solid #444; border-radius: 4px; }
    .btn-delete { width: auto; padding: 5px 10px; font-size: 12px; cursor: pointer; background: #2d2d2d; color: #d4d4d4; border: 1px solid #444; border-radius: 4px; }
    .status { margin-top: 8px; font-size: 12px; opacity: 0.7; white-space: pre-wrap; }
    .sidebar-divider { margin: 0; border: none; border-top: 1px solid #333; flex-shrink: 0; }
    canvas { width: 100%; height: 100%; display: block; background: #f5f5f5; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .nav-search-wrap { display: flex; align-items: center; padding: 8px; gap: 4px; border-bottom: 1px solid #333; flex-shrink: 0; }
    .nav-search-wrap input { flex: 1; padding: 5px 7px; font-size: 13px; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; background: #2d2d2d; color: #d4d4d4; }
    .nav-search-wrap input::placeholder { color: #666; }
    .nav-clear-btn { padding: 4px 7px; font-size: 14px; cursor: pointer; border: none; background: none; color: #888; }
    .nav-header { padding: 6px 12px; font-size: 12px; font-weight: 600; color: #888; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .nav-count { background: #333; border-radius: 8px; padding: 1px 6px; font-size: 11px; color: #aaa; }
    #navTree { flex: 1; overflow-y: auto; }
    .nav-sg-row { display: flex; align-items: center; gap: 6px; padding: 7px 12px; background: #2a2a2a; cursor: pointer; font-size: 12px; font-weight: 600; color: #c8c8c8; user-select: none; border-bottom: 1px solid #333; }
    .nav-sg-row:hover { background: #1565c0; color: #fff; border-bottom-color: #1565c0; }
    .nav-sg-count { color: #777; margin-left: auto; font-weight: 400; }
    .nav-sg-row:hover .nav-sg-count { color: rgba(255,255,255,0.75); }
    .nav-screen-row { padding: 5px 12px 5px 28px; font-size: 12px; color: #b0b0b0; background: #1e1e1e; border-bottom: 1px solid #2a2a2a; }
    .nav-screen-row:hover { background: #1a3a5c; color: #e8f4ff; }
    .modal.hidden { display: none; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }
    .modal-content {
      width: min(900px, 92vw);
      max-height: 86vh;
      overflow: auto;
      background: #fff;
      color: #111;
      border-radius: 10px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      padding: 14px;
    }
    .upload-modal-content {
      width: min(480px, 92vw);
    }
    .upload-modal-content .field { margin-bottom: 12px; }
    .upload-modal-content label { display: block; margin-bottom: 6px; font-size: 13px; }
    .upload-modal-content input, .upload-modal-content button { width: 100%; box-sizing: border-box; padding: 8px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .modal-header h2 { margin: 0; font-size: 18px; }
    .close-btn { width: auto; padding: 6px 10px; font-size: 18px; line-height: 1; }
    .state-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .state-item {
      border: 2px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
      cursor: pointer;
      padding: 0;
      text-align: left;
    }
    .state-item.selected { border-color: #2196f3; box-shadow: 0 0 0 2px rgba(33,150,243,0.2) inset; }
    .state-thumb {
      width: 100%;
      height: 180px;
      display: block;
      background: #eee;
      object-fit: contain;
      object-position: center;
    }
    .state-meta { padding: 8px; font-size: 12px; color: #333; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-heading">Graph</div>
      <select id="graphSelect">
        <option value="__upload__">+ Upload graph…</option>
        <option disabled class="select-sep">──────────────</option>
      </select>
      <button id="deleteButton" class="btn-delete">Delete</button>
      <div class="status" id="status"></div>
    </div>
    <hr class="sidebar-divider" />
    <div class="nav-search-wrap">
      <input type="text" id="navSearch" placeholder="Search…" autocomplete="off" />
      <button id="navSearchClear" class="nav-clear-btn" style="display:none">×</button>
    </div>
    <div class="nav-header">
      <span>Subgraphs</span>
      <span class="nav-count" id="navCount"></span>
    </div>
    <div id="navTree"></div>
  </div>

  <canvas id="graphCanvas"></canvas>

  <div id="uploadModal" class="modal hidden" aria-modal="true" role="dialog">
    <div class="modal-content upload-modal-content">
      <div class="modal-header">
        <h2>Upload Graph</h2>
        <button id="uploadModalClose" class="close-btn">×</button>
      </div>
      <div class="field">
        <label for="graphName">Graph name</label>
        <input id="graphName" type="text" placeholder="My Feature Graph" />
      </div>
      <div class="field">
        <label for="zipArchive">ZIP archive (<code>app-graph.json</code> + <code>screenshots/</code>)</label>
        <input id="zipArchive" type="file" accept=".zip,application/zip" />
      </div>
      <div class="field">
        <button id="uploadButton">Upload</button>
      </div>
      <div id="uploadStatus" class="status"></div>
    </div>
  </div>

  <div id="statePickerModal" class="modal hidden" aria-modal="true" role="dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="statePickerTitle">Select image state</h2>
        <button id="statePickerClose" class="close-btn" title="Close">×</button>
      </div>
      <div id="statePickerGrid" class="state-grid"></div>
    </div>
  </div>

  <script>
    const graphNameInput = document.getElementById("graphName");
    const zipArchiveInput = document.getElementById("zipArchive");
    const graphSelect = document.getElementById("graphSelect");
    const uploadButton = document.getElementById("uploadButton");
    const uploadModal = document.getElementById("uploadModal");
    const uploadModalClose = document.getElementById("uploadModalClose");
    const uploadStatus = document.getElementById("uploadStatus");
    const deleteButton = document.getElementById("deleteButton");
    const statusBox = document.getElementById("status");
    const canvas = document.getElementById("graphCanvas");
    const ctx = canvas.getContext("2d");
    const statePickerModal = document.getElementById("statePickerModal");
    const statePickerTitle = document.getElementById("statePickerTitle");
    const statePickerGrid = document.getElementById("statePickerGrid");
    const statePickerClose = document.getElementById("statePickerClose");
    const navSearch = document.getElementById("navSearch");
    const navSearchClear = document.getElementById("navSearchClear");
    const navCount = document.getElementById("navCount");
    const navTree = document.getElementById("navTree");

    let layout = null;
    let currentGraphId = null;
    let navSubgraphs = null; // Map<key, [{nodeId, label}]> built when graph is rendered
    const expandedSubgraphs = new Set();
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let dragMoved = false;
    let hoveredEdgeIndex = null;
    let hoveredNodeId = null;
    let hoveredIconNodeId = null;
    const imageCache = new Map();
    let modalLastClickAt = 0;
    const stateIconImage = new Image();
    let stateIconLoaded = false;
    stateIconImage.onload = () => {
      stateIconLoaded = true;
      draw();
    };
    stateIconImage.src = "/img_states_24.png";
    const ZOOM_MIN = 0.1;
    const ZOOM_MAX = 3;
    const WHEEL_ZOOM_INTENSITY = 0.0018;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    async function refreshGraphs(selectedGraphId = null) {
      const res = await fetch("/api/graphs");
      if (!res.ok) {
        throw new Error(`Failed to fetch graphs (${res.status})`);
      }
      const data = await res.json();
      const graphIds = Array.isArray(data.graphIds) ? data.graphIds : [];

      // Keep first 2 options (upload + separator), repopulate from index 2
      while (graphSelect.options.length > 2) {
        graphSelect.remove(2);
      }
      for (const id of graphIds) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        graphSelect.appendChild(opt);
      }
      if (selectedGraphId && graphIds.includes(selectedGraphId)) {
        graphSelect.value = selectedGraphId;
      } else {
        graphSelect.value = "__upload__";
      }
    }

    function openUploadModal() {
      uploadModal.classList.remove("hidden");
    }

    function closeUploadModal() {
      uploadModal.classList.add("hidden");
      uploadStatus.textContent = "";
    }

    graphSelect.addEventListener("change", () => {
      const val = graphSelect.value;
      if (val === "__upload__") {
        openUploadModal();
        graphSelect.value = currentGraphId || "__upload__";
        return;
      }
      if (val) loadGraph(val).catch(e => setStatus(e.message));
    });

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function transformPoint(x, y) {
      return { x: x * zoom + panX, y: y * zoom + panY };
    }

    function setViewInstant(newZoom, newPanX, newPanY) {
      zoom = newZoom;
      panX = newPanX;
      panY = newPanY;
    }

    function applyZoomAtPoint(nextZoom, mx, my, baseZoom = zoom, basePanX = panX, basePanY = panY) {
      const clampedZoom = clamp(nextZoom, ZOOM_MIN, ZOOM_MAX);
      const ratio = clampedZoom / baseZoom;
      zoom = clampedZoom;
      panX = mx - (mx - basePanX) * ratio;
      panY = my - (my - basePanY) * ratio;
      draw();
    }

    function formatNodeLabel(nodeId) {
      const leaf = (nodeId.split(":").pop() || nodeId)
        .replace(/(Screen|Route|Fragment|Activity|Destination)$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
        .replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2")
        .trim();
      return leaf || nodeId;
    }

    function panToNode(nodeId) {
      const node = layout && layout.nodes.find(n => n.id === nodeId);
      if (!node) return;
      const rect = canvas.getBoundingClientRect();
      panX = rect.width / 2 - node.x * zoom;
      panY = rect.height / 2 - node.y * zoom;
      draw();
    }

    function renderNavTree(subgraphs, query) {
      navTree.innerHTML = '';
      const q = query.trim().toLowerCase();
      for (const [key, screens] of subgraphs) {
        let visibleScreens = screens;
        let forceExpand = false;
        if (q) {
          if (key.toLowerCase().includes(q)) {
            forceExpand = true;
          } else {
            visibleScreens = screens.filter(s => s.label.toLowerCase().includes(q));
            if (visibleScreens.length === 0) continue;
            forceExpand = true;
          }
        }
        const isExpanded = forceExpand || expandedSubgraphs.has(key);
        const sgRow = document.createElement('div');
        sgRow.className = 'nav-sg-row';
        sgRow.innerHTML = `<span>${isExpanded ? '▾' : '▸'}</span><span style="flex:1">${escapeHtml(key)}</span><span class="nav-sg-count">${visibleScreens.length}</span>`;
        if (!forceExpand) {
          sgRow.addEventListener('click', () => {
            expandedSubgraphs.has(key) ? expandedSubgraphs.delete(key) : expandedSubgraphs.add(key);
            renderNavTree(subgraphs, navSearch.value);
          });
        }
        navTree.appendChild(sgRow);
        if (isExpanded) {
          for (const { nodeId, label } of visibleScreens) {
            const screenRow = document.createElement('div');
            screenRow.className = 'nav-screen-row';
            screenRow.textContent = label;
            screenRow.addEventListener('click', () => panToNode(nodeId));
            navTree.appendChild(screenRow);
          }
        }
      }
    }

    function buildNavTree() {
      navSubgraphs = new Map();
      for (const node of layout.nodes) {
        const key = node.id.includes(':') ? node.id.slice(0, node.id.indexOf(':')) : '';
        const label = formatNodeLabel(node.id);
        if (!navSubgraphs.has(key)) navSubgraphs.set(key, []);
        navSubgraphs.get(key).push({ nodeId: node.id, label });
      }
      navCount.textContent = navSubgraphs.size;
      navSearch.value = '';
      navSearchClear.style.display = 'none';
      expandedSubgraphs.clear();
      renderNavTree(navSubgraphs, '');
    }

    function clearNavTree() {
      navSubgraphs = null;
      navTree.innerHTML = '';
      navCount.textContent = '';
      navSearch.value = '';
      navSearchClear.style.display = 'none';
      expandedSubgraphs.clear();
    }

    navSearch.addEventListener('input', () => {
      const q = navSearch.value;
      navSearchClear.style.display = q ? 'block' : 'none';
      if (navSubgraphs) renderNavTree(navSubgraphs, q);
    });

    navSearchClear.addEventListener('click', () => {
      navSearch.value = '';
      navSearchClear.style.display = 'none';
      if (navSubgraphs) renderNavTree(navSubgraphs, '');
    });

    function distanceToSegment(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const abLen2 = abx * abx + aby * aby;
      if (abLen2 === 0) return Math.hypot(px - ax, py - ay);
      const t = clamp((apx * abx + apy * aby) / abLen2, 0, 1);
      const cx = ax + abx * t;
      const cy = ay + aby * t;
      return Math.hypot(px - cx, py - cy);
    }

    function cubicPoint(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const tt = t * t;
      const uu = u * u;
      const uuu = uu * u;
      const ttt = tt * t;
      return {
        x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
        y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
      };
    }

    function distanceToCubicBezier(p0, p1, p2, p3, p) {
      const samples = 32;
      let best = Number.POSITIVE_INFINITY;
      let prev = cubicPoint(p0, p1, p2, p3, 0);
      for (let i = 1; i <= samples; i++) {
        const t = i / samples;
        const cur = cubicPoint(p0, p1, p2, p3, t);
        const d = distanceToSegment(p.x, p.y, prev.x, prev.y, cur.x, cur.y);
        if (d < best) best = d;
        prev = cur;
      }
      return best;
    }

    function findHoveredEdgeIndex(pointerX, pointerY) {
      if (!layout) return null;
      let bestIndex = null;
      let bestDistance = Number.POSITIVE_INFINITY;
      layout.edges.forEach((edge, edgeIndex) => {
        const points = edge.points.map(p => transformPoint(p.x, p.y));
        let distance = Number.POSITIVE_INFINITY;
        if (points.length >= 4) {
          distance = distanceToCubicBezier(points[0], points[1], points[2], points[3], { x: pointerX, y: pointerY });
        } else if (points.length >= 2) {
          for (let i = 0; i < points.length - 1; i++) {
            const d = distanceToSegment(pointerX, pointerY, points[i].x, points[i].y, points[i + 1].x, points[i + 1].y);
            if (d < distance) distance = d;
          }
        }
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = edgeIndex;
        }
      });
      return bestDistance <= 10 ? bestIndex : null;
    }

    function centerOnLeftmostNode() {
      if (!layout || !layout.nodes || layout.nodes.length === 0) {
        setViewInstant(1, 40, 40);
        return;
      }
      const leftmost = layout.nodes.reduce((best, node) => {
        if (!best) return node;
        if (node.x < best.x) return node;
        if (node.x === best.x && node.y < best.y) return node;
        return best;
      }, null);
      if (!leftmost) {
        setViewInstant(1, 40, 40);
        return;
      }
      const viewport = canvas.getBoundingClientRect();
      const initialZoom = 1;
      const initialPanX = viewport.width / 2 - leftmost.x * initialZoom;
      const initialPanY = viewport.height / 2 - leftmost.y * initialZoom;
      setViewInstant(initialZoom, initialPanX, initialPanY);
    }

    function getNodeImagePaths(node) {
      return Array.isArray(node.imagePaths) ? node.imagePaths : [];
    }

    function normalizeSelectedState(node) {
      const imagePaths = getNodeImagePaths(node);
      const raw = Number.isInteger(node.selectedState) ? node.selectedState : 0;
      if (imagePaths.length === 0) return 0;
      return clamp(raw, 0, imagePaths.length - 1);
    }

    function getSelectedImagePath(node) {
      const imagePaths = getNodeImagePaths(node);
      if (imagePaths.length === 0) return null;
      const selectedState = normalizeSelectedState(node);
      return imagePaths[selectedState] || imagePaths[0] || null;
    }

    function loadImage(path) {
      if (!path) return null;
      const cached = imageCache.get(path);
      if (cached) return cached;
      const image = new Image();
      const entry = { status: "loading", image };
      imageCache.set(path, entry);
      image.onload = () => {
        entry.status = "loaded";
        draw();
      };
      image.onerror = () => {
        entry.status = "failed";
        draw();
      };
      image.src = path;
      return entry;
    }

    function drawImagePlaceholder(x, y, w, h, text) {
      ctx.fillStyle = "#efefef";
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = "#8b8b8b";
      const fontSize = clamp(12 * Math.sqrt(zoom), 7, 20);
      ctx.font = `${fontSize}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x + w / 2, y + h / 2);
      ctx.textAlign = "start";
      ctx.textBaseline = "alphabetic";
    }

    function drawNodeImage(node, x, y, w, h) {
      const selectedPath = getSelectedImagePath(node);
      if (!selectedPath) {
        drawImagePlaceholder(x, y, w, h, "No image");
        return;
      }
      const entry = loadImage(selectedPath);
      if (entry && entry.status === "loaded") {
        ctx.drawImage(entry.image, x, y, w, h);
        return;
      }
      if (entry && entry.status === "failed") {
        drawImagePlaceholder(x, y, w, h, "Image unavailable");
        return;
      }
      drawImagePlaceholder(x, y, w, h, "Loading...");
    }

    function findNodeAt(pointerX, pointerY) {
      if (!layout || !Array.isArray(layout.nodes)) return null;
      for (let i = layout.nodes.length - 1; i >= 0; i--) {
        const node = layout.nodes[i];
        const center = transformPoint(node.x, node.y);
        const w = node.width * zoom;
        const h = node.height * zoom;
        const x = center.x - w / 2;
        const y = center.y - h / 2;
        if (pointerX >= x && pointerX <= x + w && pointerY >= y && pointerY <= y + h) {
          return node;
        }
      }
      return null;
    }

    function getStateIconRect(node) {
      const center = transformPoint(node.x, node.y);
      const w = node.width * zoom;
      const h = node.height * zoom;
      const x = center.x - w / 2;
      const y = center.y - h / 2;
      const iconSize = clamp(24 * zoom, 24, 32);
      const iconPadding = clamp(4 * zoom, 4, 8);
      return {
        x: x + w - iconSize - iconPadding,
        y: y + iconPadding,
        size: iconSize
      };
    }

    function findHoveredIconNodeId(pointerX, pointerY, node) {
      if (!node) return null;
      const imagePaths = getNodeImagePaths(node);
      if (imagePaths.length <= 1) return null;
      const rect = getStateIconRect(node);
      const insideX = pointerX >= rect.x && pointerX <= rect.x + rect.size;
      const insideY = pointerY >= rect.y && pointerY <= rect.y + rect.size;
      return insideX && insideY ? node.id : null;
    }

    function drawStateIcon(node) {
      if (!stateIconLoaded) return;
      const imagePaths = getNodeImagePaths(node);
      if (imagePaths.length <= 1 || hoveredNodeId !== node.id) return;
      const rect = getStateIconRect(node);
      ctx.save();
      ctx.globalAlpha = hoveredIconNodeId === node.id ? 0.9 : 0.5;
      ctx.drawImage(stateIconImage, rect.x, rect.y, rect.size, rect.size);
      ctx.restore();
    }

    function closeStatePicker() {
      statePickerGrid.innerHTML = "";
      statePickerModal.classList.add("hidden");
      modalLastClickAt = 0;
    }

    function renderStatePicker(node) {
      const imagePaths = getNodeImagePaths(node);
      const selectedState = normalizeSelectedState(node);
      statePickerTitle.textContent = `Select state for ${formatNodeLabel(node.id)}`;
      statePickerGrid.innerHTML = "";

      imagePaths.forEach((path, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `state-item${index === selectedState ? " selected" : ""}`;
        button.addEventListener("click", () => {
          node.selectedState = index;
          draw();
          renderStatePicker(node);
          setStatus(`Selected state ${index + 1}/${imagePaths.length} for ${formatNodeLabel(node.id)}.`);
        });

        const img = document.createElement("img");
        img.className = "state-thumb";
        img.alt = `State ${index + 1}`;
        img.src = path;
        button.appendChild(img);

        const meta = document.createElement("div");
        meta.className = "state-meta";
        meta.textContent = `State ${index + 1}`;
        button.appendChild(meta);

        statePickerGrid.appendChild(button);
      });
    }

    function openStatePicker(node) {
      const imagePaths = getNodeImagePaths(node);
      if (imagePaths.length <= 1) return;
      renderStatePicker(node);
      modalLastClickAt = 0;
      statePickerModal.classList.remove("hidden");
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (!layout) return;

      for (let edgeIndex = 0; edgeIndex < layout.edges.length; edgeIndex++) {
        const edge = layout.edges[edgeIndex];
        const isHovered = hoveredEdgeIndex === edgeIndex;
        ctx.strokeStyle = isHovered ? "#2196f3" : "rgba(136,136,136,0.6)";
        ctx.lineWidth = isHovered ? 3.5 : 1.8;
        const points = edge.points.map(p => transformPoint(p.x, p.y));
        if (points.length >= 4) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          ctx.bezierCurveTo(points[1].x, points[1].y, points[2].x, points[2].y, points[3].x, points[3].y);
          ctx.stroke();
        } else if (points.length >= 2) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
          ctx.stroke();
        }
      }

      for (const node of layout.nodes) {
        const center = transformPoint(node.x, node.y);
        const w = node.width * zoom;
        const h = node.height * zoom;
        const x = center.x - w / 2;
        const y = center.y - h / 2;

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x, y, w, h);
        drawNodeImage(node, x, y, w, h);
        ctx.strokeStyle = "#cccccc";
        ctx.lineWidth = 1 * zoom;
        ctx.strokeRect(x, y, w, h);
        drawStateIcon(node);

        const labelText = formatNodeLabel(node.id);
        const labelFontSize = clamp(20 * Math.sqrt(zoom), 6, 40);
        const labelY = y - 8;
        ctx.font = `${labelFontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        const labelWidth = ctx.measureText(labelText).width;
        const labelPadding = 6;
        ctx.fillStyle = "rgba(245,245,245,0.9)";
        ctx.fillRect(
          center.x - labelWidth / 2 - labelPadding,
          labelY - labelFontSize - 2,
          labelWidth + labelPadding * 2,
          labelFontSize + 4
        );
        ctx.fillStyle = "#212121";
        ctx.fillText(labelText, center.x, labelY);
        ctx.textAlign = "start";
        ctx.textBaseline = "alphabetic";
      }
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    async function loadGraph(graphId) {
      setStatus(`Loading ${graphId}...`);
      const res = await fetch(`/api/layout/${encodeURIComponent(graphId)}`);
      if (!res.ok) {
        const body = await res.text();
        throw new Error(`Layout failed (${res.status}): ${body}`);
      }
      layout = await res.json();
      layout.nodes = Array.isArray(layout.nodes) ? layout.nodes.map(node => ({
        ...node,
        imagePaths: Array.isArray(node.imagePaths) ? node.imagePaths : [],
        selectedState: Number.isInteger(node.selectedState) ? node.selectedState : 0
      })) : [];
      hoveredEdgeIndex = null;
      hoveredNodeId = null;
      hoveredIconNodeId = null;
      closeStatePicker();
      centerOnLeftmostNode();
      draw();
      buildNavTree();
      currentGraphId = graphId;
      graphSelect.value = graphId;
      history.pushState(null, '', '/graph/' + encodeURIComponent(graphId));
      setStatus(`Loaded ${graphId}: ${layout.nodes.length} nodes, ${layout.edges.length} edges.`);
    }

    async function uploadGraph() {
      const archive = zipArchiveInput.files?.[0];
      const graphName = graphNameInput.value.trim();
      if (!archive) {
        uploadStatus.textContent = "Select a ZIP archive first.";
        return;
      }
      if (!graphName) {
        uploadStatus.textContent = "Provide a graph name first.";
        return;
      }

      uploadStatus.textContent = "Uploading graph...";
      const form = new FormData();
      form.append("graphName", graphName);
      form.append("archive", archive);
      const res = await fetch("/api/upload-graph", { method: "POST", body: form });
      const payloadText = await res.text();
      if (!res.ok) {
        uploadStatus.textContent = `Upload failed (${res.status}): ${payloadText}`;
        return;
      }
      const payload = JSON.parse(payloadText);
      closeUploadModal();
      await refreshGraphs(payload.graphId);
      await loadGraph(payload.graphId);
    }

    async function deleteSelectedGraph() {
      const graphId = currentGraphId || graphSelect.value;
      if (!graphId || graphId === "__upload__") {
        setStatus("Select a graph first.");
        return;
      }
      if (!window.confirm(`Delete graph '${graphId}'?`)) return;
      setStatus(`Deleting ${graphId}...`);
      const res = await fetch(`/api/graph/${encodeURIComponent(graphId)}`, { method: "DELETE" });
      if (!res.ok) {
        const body = await res.text();
        setStatus(`Delete failed (${res.status}): ${body}`);
        return;
      }
      history.pushState(null, '', '/');
      currentGraphId = null;
      layout = null;
      hoveredEdgeIndex = null;
      hoveredNodeId = null;
      hoveredIconNodeId = null;
      closeStatePicker();
      clearNavTree();
      draw();
      await refreshGraphs();
      setStatus(`Deleted ${graphId}.`);
    }

    uploadButton.addEventListener("click", () => uploadGraph().catch(e => { uploadStatus.textContent = e.message; }));
    uploadModalClose.addEventListener("click", closeUploadModal);
    uploadModal.addEventListener("click", (event) => {
      if (event.target === uploadModal) closeUploadModal();
    });
    deleteButton.addEventListener("click", () => deleteSelectedGraph().catch(e => setStatus(e.message)));

    canvas.addEventListener("wheel", (e) => {
      if (!layout) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const scale = Math.exp(-e.deltaY * WHEEL_ZOOM_INTENSITY);
      applyZoomAtPoint(zoom * scale, mx, my);
    }, { passive: false });

    canvas.addEventListener("mousedown", (e) => {
      dragging = true;
      dragMoved = false;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.classList.add("dragging");
    });

    window.addEventListener("mouseup", () => {
      dragging = false;
      canvas.classList.remove("dragging");
    });

    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        dragMoved = true;
      }
      setViewInstant(zoom, panX + dx, panY + dy);
      lastX = e.clientX;
      lastY = e.clientY;
      draw();
    });

    canvas.addEventListener("click", (e) => {
      if (!layout || dragMoved) return;
      const rect = canvas.getBoundingClientRect();
      const pointerX = e.clientX - rect.left;
      const pointerY = e.clientY - rect.top;
      const node = findNodeAt(pointerX, pointerY);
      if (!node) return;
      const hoveredIconNode = findHoveredIconNodeId(pointerX, pointerY, node);
      if (hoveredIconNode === node.id) {
        openStatePicker(node);
        return;
      }
      openStatePicker(node);
    });

    canvas.addEventListener("mousemove", (e) => {
      if (!layout || dragging) return;
      const rect = canvas.getBoundingClientRect();
      const pointerX = e.clientX - rect.left;
      const pointerY = e.clientY - rect.top;
      const hoveredNode = findNodeAt(pointerX, pointerY);
      const nextHoveredNodeId = hoveredNode ? hoveredNode.id : null;
      const nextHoveredIconNodeId = findHoveredIconNodeId(pointerX, pointerY, hoveredNode);
      const nextHovered = findHoveredEdgeIndex(pointerX, pointerY);
      if (
        nextHovered !== hoveredEdgeIndex ||
        nextHoveredNodeId !== hoveredNodeId ||
        nextHoveredIconNodeId !== hoveredIconNodeId
      ) {
        hoveredEdgeIndex = nextHovered;
        hoveredNodeId = nextHoveredNodeId;
        hoveredIconNodeId = nextHoveredIconNodeId;
        draw();
      }
    });

    canvas.addEventListener("mouseleave", () => {
      if (hoveredEdgeIndex !== null || hoveredNodeId !== null || hoveredIconNodeId !== null) {
        hoveredEdgeIndex = null;
        hoveredNodeId = null;
        hoveredIconNodeId = null;
        draw();
      }
    });

    statePickerClose.addEventListener("click", closeStatePicker);
    window.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!uploadModal.classList.contains("hidden")) {
        event.preventDefault();
        closeUploadModal();
        return;
      }
      if (!statePickerModal.classList.contains("hidden")) {
        event.preventDefault();
        closeStatePicker();
      }
    });
    statePickerModal.addEventListener("click", (event) => {
      if (event.target === statePickerModal) {
        closeStatePicker();
        return;
      }
      const now = Date.now();
      const isSecondClick = modalLastClickAt > 0 && (now - modalLastClickAt) <= 300;
      modalLastClickAt = now;
      if (isSecondClick) {
        closeStatePicker();
      }
    });

    window.addEventListener("popstate", () => {
      const m2 = location.pathname.match(/^\/graph\/([^/]+)$/);
      if (m2) loadGraph(decodeURIComponent(m2[1])).catch(e => setStatus(e.message));
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const m = location.pathname.match(/^\/graph\/([^/]+)$/);
    const initialGraphId = m ? decodeURIComponent(m[1]) : null;
    refreshGraphs(initialGraphId).then(() => {
      if (initialGraphId) return loadGraph(initialGraphId).catch(e => setStatus(e.message));
      else setStatus("Ready.");
    }).catch(e => setStatus(e.message));
  </script>
</body>
</html>
