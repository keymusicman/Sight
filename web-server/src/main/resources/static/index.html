<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppFlower Web Graph Viewer</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
    .panel { padding: 16px; border-right: 1px solid #ccc; overflow: auto; }
    .panel h1 { margin-top: 0; font-size: 18px; }
    textarea { width: 100%; min-height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    button { margin-top: 12px; width: 100%; padding: 10px; }
    .status { margin-top: 10px; font-size: 13px; opacity: 0.9; white-space: pre-wrap; }
    canvas { width: 100%; height: 100%; display: block; background: #f5f5f5; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>AppFlower Web Graph Viewer</h1>
    <p>Upload or paste <code>app-graph.json</code> then click Render.</p>
    <input id="jsonFile" type="file" accept=".json,application/json" />
    <p style="margin-bottom:4px;">Optional: upload screenshot files for node previews.</p>
    <input id="imageFiles" type="file" accept="image/*" multiple />
    <p style="margin-bottom:4px;">Or upload ZIP archive (<code>app-graph.json</code> + screenshots dir).</p>
    <input id="zipArchive" type="file" accept=".zip,application/zip" />
    <textarea id="jsonInput" placeholder='{"metadata":...,"subgraphs":...}'></textarea>
    <button id="renderButton">Render Graph</button>
    <button id="renderZipButton">Render ZIP Archive</button>
    <div class="status" id="status">Ready.</div>
  </div>
  <canvas id="graphCanvas"></canvas>

  <script>
    const jsonInput = document.getElementById("jsonInput");
    const jsonFile = document.getElementById("jsonFile");
    const imageFiles = document.getElementById("imageFiles");
    const zipArchive = document.getElementById("zipArchive");
    const renderButton = document.getElementById("renderButton");
    const renderZipButton = document.getElementById("renderZipButton");
    const statusBox = document.getElementById("status");
    const canvas = document.getElementById("graphCanvas");
    const ctx = canvas.getContext("2d");

    let layout = null;
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let pinchStartDistance = null;
    let pinchStartZoom = 1;
    let pinchStartPanX = 0;
    let pinchStartPanY = 0;
    const imageByFileName = new Map();
    const imageByNodeId = new Map();
    const ZOOM_MIN = 0.1;
    const ZOOM_MAX = 3;
    const WHEEL_ZOOM_INTENSITY = 0.0018;
    const PINCH_ZOOM_DAMPING = 1.4;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    jsonFile.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        jsonInput.value = await file.text();
        setStatus(`Loaded ${file.name}`);
      } catch (e) {
        setStatus("Could not read file: " + e.message);
      }
    });

    imageFiles.addEventListener("change", async (event) => {
      imageByFileName.clear();
      const files = Array.from(event.target.files || []);
      const loadImage = (file) => new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`Failed to load ${file.name}`)); };
        img.src = url;
      });

      let loaded = 0;
      for (const file of files) {
        try {
          const image = await loadImage(file);
          imageByFileName.set(file.name, image);
          loaded++;
        } catch (_) {
        }
      }
      setStatus(`Loaded ${loaded}/${files.length} screenshot files.`);
      draw();
    });

    function findNodeImage(nodeId) {
      if (imageByNodeId.has(nodeId)) {
        return imageByNodeId.get(nodeId);
      }
      const screenId = (nodeId.split(":").pop() || nodeId).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`^${screenId}(?:_.+?)?_\\d+\\.(png|jpg|jpeg|webp)$`, "i");
      for (const [name, image] of imageByFileName.entries()) {
        if (regex.test(name)) return image;
      }
      return null;
    }

    async function hydrateInlineImages(nodes) {
      imageByNodeId.clear();
      const loadDataUrl = (nodeId, dataUrl) => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve({ nodeId, img });
        img.onerror = () => reject(new Error(`Failed to decode image for ${nodeId}`));
        img.src = dataUrl;
      });
      const jobs = nodes
        .filter(node => node.imageDataUrl)
        .map(node => loadDataUrl(node.id, node.imageDataUrl));
      const loaded = await Promise.allSettled(jobs);
      for (const r of loaded) {
        if (r.status === "fulfilled") {
          imageByNodeId.set(r.value.nodeId, r.value.img);
        }
      }
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function transformPoint(x, y) {
      return { x: x * zoom + panX, y: y * zoom + panY };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function setViewInstant(newZoom, newPanX, newPanY) {
      zoom = newZoom;
      panX = newPanX;
      panY = newPanY;
    }

    function applyZoomAtPoint(nextZoom, mx, my, baseZoom = zoom, basePanX = panX, basePanY = panY) {
      const clampedZoom = clamp(nextZoom, ZOOM_MIN, ZOOM_MAX);
      const ratio = clampedZoom / baseZoom;
      zoom = clampedZoom;
      panX = mx - (mx - basePanX) * ratio;
      panY = my - (my - basePanY) * ratio;
      draw();
    }

    function touchDistance(t1, t2) {
      const dx = t2.clientX - t1.clientX;
      const dy = t2.clientY - t1.clientY;
      return Math.hypot(dx, dy);
    }

    function touchMidpointOnCanvas(t1, t2) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (t1.clientX + t2.clientX) / 2 - rect.left,
        y: (t1.clientY + t2.clientY) / 2 - rect.top
      };
    }

    function centerOnLeftmostNode() {
      if (!layout || !layout.nodes || layout.nodes.length === 0) {
        setViewInstant(1, 40, 40);
        return;
      }
      const leftmost = layout.nodes.reduce((best, node) => {
        if (!best) return node;
        if (node.x < best.x) return node;
        if (node.x === best.x && node.y < best.y) return node;
        return best;
      }, null);
      if (!leftmost) {
        setViewInstant(1, 40, 40);
        return;
      }
      const viewport = canvas.getBoundingClientRect();
      const initialZoom = 1;
      const initialPanX = viewport.width / 2 - leftmost.x * initialZoom;
      const initialPanY = viewport.height / 2 - leftmost.y * initialZoom;
      setViewInstant(initialZoom, initialPanX, initialPanY);
    }

    function formatNodeLabel(nodeId) {
      const leaf = (nodeId.split(":").pop() || nodeId)
        .replace(/(Screen|Route|Fragment|Activity|Destination)$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
        .replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2")
        .trim();
      return leaf || nodeId;
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (!layout) return;

      ctx.strokeStyle = "rgba(136,136,136,0.6)";
      ctx.lineWidth = 1.8;
      for (const edge of layout.edges) {
        const points = edge.points.map(p => transformPoint(p.x, p.y));
        if (points.length >= 4) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          ctx.bezierCurveTo(points[1].x, points[1].y, points[2].x, points[2].y, points[3].x, points[3].y);
          ctx.stroke();
        } else if (points.length >= 2) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
          ctx.stroke();
        }
      }

      for (const node of layout.nodes) {
        const center = transformPoint(node.x, node.y);
        const w = node.width * zoom;
        const h = node.height * zoom;
        const x = center.x - w / 2;
        const y = center.y - h / 2;

        const nodeImage = findNodeImage(node.id);
        ctx.fillStyle = "white";
        ctx.strokeStyle = "#cccccc";
        ctx.lineWidth = 1 * zoom;
        if (nodeImage) {
          ctx.drawImage(nodeImage, x, y, w, h);
        } else {
          ctx.fillRect(x, y, w, h);
        }
        ctx.strokeRect(x, y, w, h);

        const labelText = formatNodeLabel(node.id);
        const labelFontSize = clamp(20 * Math.sqrt(zoom), 6, 40);
        const labelY = y - 8;
        ctx.font = `${labelFontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        const labelWidth = ctx.measureText(labelText).width;
        const labelPadding = 6;
        ctx.fillStyle = "rgba(245,245,245,0.9)";
        ctx.fillRect(
          center.x - labelWidth / 2 - labelPadding,
          labelY - labelFontSize - 2,
          labelWidth + labelPadding * 2,
          labelFontSize + 4
        );
        ctx.fillStyle = "#212121";
        ctx.fillText(labelText, center.x, labelY);
        ctx.textAlign = "start";
        ctx.textBaseline = "alphabetic";
      }
    }

    renderButton.addEventListener("click", async () => {
      const raw = jsonInput.value.trim();
      if (!raw) {
        setStatus("Please paste app-graph.json content.");
        return;
      }
      try {
        JSON.parse(raw);
      } catch (e) {
        setStatus("Invalid JSON: " + e.message);
        return;
      }
      setStatus("Rendering...");
      const res = await fetch("/api/layout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: raw
      });
      if (!res.ok) {
        const body = await res.text();
        setStatus(`API error (${res.status}): ${body}`);
        return;
      }
      layout = await res.json();
      await hydrateInlineImages(layout.nodes);
      centerOnLeftmostNode();
      draw();
      setStatus(`Rendered ${layout.nodes.length} nodes, ${layout.edges.length} edges.`);
    });

    renderZipButton.addEventListener("click", async () => {
      const archive = zipArchive.files?.[0];
      if (!archive) {
        setStatus("Please choose a ZIP archive first.");
        return;
      }
      setStatus("Uploading ZIP and rendering...");
      const form = new FormData();
      form.append("archive", archive);
      const res = await fetch("/api/layout-zip", { method: "POST", body: form });
      if (!res.ok) {
        const body = await res.text();
        setStatus(`ZIP API error (${res.status}): ${body}`);
        return;
      }
      layout = await res.json();
      await hydrateInlineImages(layout.nodes);
      centerOnLeftmostNode();
      draw();
      setStatus(`Rendered ZIP: ${layout.nodes.length} nodes, ${layout.edges.length} edges.`);
    });

    canvas.addEventListener("wheel", (e) => {
      if (!layout) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const scale = Math.exp(-e.deltaY * WHEEL_ZOOM_INTENSITY);
      applyZoomAtPoint(zoom * scale, mx, my);
    }, { passive: false });

    canvas.addEventListener("mousedown", (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.classList.add("dragging");
    });
    window.addEventListener("mouseup", () => {
      dragging = false;
      canvas.classList.remove("dragging");
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      setViewInstant(zoom, panX + dx, panY + dy);
      lastX = e.clientX;
      lastY = e.clientY;
      draw();
    });

    canvas.addEventListener("touchstart", (e) => {
      if (!layout) return;
      if (e.touches.length === 2) {
        e.preventDefault();
        pinchStartDistance = touchDistance(e.touches[0], e.touches[1]);
        pinchStartZoom = zoom;
        pinchStartPanX = panX;
        pinchStartPanY = panY;
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      if (!layout) return;
      if (e.touches.length === 2 && pinchStartDistance) {
        e.preventDefault();
        const currentDistance = touchDistance(e.touches[0], e.touches[1]);
        const rawScale = currentDistance / pinchStartDistance;
        const smoothedScale = Math.pow(rawScale, PINCH_ZOOM_DAMPING);
        const midpoint = touchMidpointOnCanvas(e.touches[0], e.touches[1]);
        applyZoomAtPoint(
          pinchStartZoom * smoothedScale,
          midpoint.x,
          midpoint.y,
          pinchStartZoom,
          pinchStartPanX,
          pinchStartPanY
        );
      }
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      pinchStartDistance = null;
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
