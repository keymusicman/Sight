<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppFlower Web Graph Viewer</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
    .panel { padding: 16px; border-right: 1px solid #ccc; overflow: auto; }
    .panel h1 { margin-top: 0; font-size: 18px; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; }
    input, select, button { width: 100%; box-sizing: border-box; padding: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status { margin-top: 10px; font-size: 13px; opacity: 0.9; white-space: pre-wrap; }
    canvas { width: 100%; height: 100%; display: block; background: #f5f5f5; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>AppFlower Graph Viewer</h1>

    <div class="field">
      <label for="graphName">Graph name (used to generate graph-id)</label>
      <input id="graphName" type="text" placeholder="My Feature Graph" />
    </div>

    <div class="field">
      <label for="zipArchive">Upload ZIP (<code>app-graph.json</code> + <code>screenshots/</code>)</label>
      <input id="zipArchive" type="file" accept=".zip,application/zip" />
    </div>

    <div class="field">
      <button id="uploadButton">Upload Graph ZIP</button>
    </div>

    <hr />

    <div class="field">
      <label for="graphSelect">Available graphs</label>
      <select id="graphSelect"></select>
    </div>

    <div class="row">
      <button id="refreshButton">Refresh List</button>
      <button id="renderButton">Render Selected</button>
    </div>

    <div class="field">
      <button id="deleteButton">Delete Selected</button>
    </div>

    <div class="status" id="status">Ready.</div>
  </div>

  <canvas id="graphCanvas"></canvas>

  <script>
    const graphNameInput = document.getElementById("graphName");
    const zipArchiveInput = document.getElementById("zipArchive");
    const graphSelect = document.getElementById("graphSelect");
    const uploadButton = document.getElementById("uploadButton");
    const refreshButton = document.getElementById("refreshButton");
    const renderButton = document.getElementById("renderButton");
    const deleteButton = document.getElementById("deleteButton");
    const statusBox = document.getElementById("status");
    const canvas = document.getElementById("graphCanvas");
    const ctx = canvas.getContext("2d");

    let layout = null;
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let hoveredEdgeIndex = null;
    const ZOOM_MIN = 0.1;
    const ZOOM_MAX = 3;
    const WHEEL_ZOOM_INTENSITY = 0.0018;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    async function refreshGraphs(selectedGraphId = null) {
      const res = await fetch("/api/graphs");
      if (!res.ok) {
        throw new Error(`Failed to fetch graphs (${res.status})`);
      }
      const data = await res.json();
      const graphIds = Array.isArray(data.graphIds) ? data.graphIds : [];

      graphSelect.innerHTML = "";
      if (graphIds.length === 0) {
        graphSelect.innerHTML = `<option value="">(No graphs found)</option>`;
        return;
      }
      for (const id of graphIds) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        graphSelect.appendChild(opt);
      }
      if (selectedGraphId && graphIds.includes(selectedGraphId)) {
        graphSelect.value = selectedGraphId;
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function transformPoint(x, y) {
      return { x: x * zoom + panX, y: y * zoom + panY };
    }

    function setViewInstant(newZoom, newPanX, newPanY) {
      zoom = newZoom;
      panX = newPanX;
      panY = newPanY;
    }

    function applyZoomAtPoint(nextZoom, mx, my, baseZoom = zoom, basePanX = panX, basePanY = panY) {
      const clampedZoom = clamp(nextZoom, ZOOM_MIN, ZOOM_MAX);
      const ratio = clampedZoom / baseZoom;
      zoom = clampedZoom;
      panX = mx - (mx - basePanX) * ratio;
      panY = my - (my - basePanY) * ratio;
      draw();
    }

    function formatNodeLabel(nodeId) {
      const leaf = (nodeId.split(":").pop() || nodeId)
        .replace(/(Screen|Route|Fragment|Activity|Destination)$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
        .replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2")
        .trim();
      return leaf || nodeId;
    }

    function distanceToSegment(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const abLen2 = abx * abx + aby * aby;
      if (abLen2 === 0) return Math.hypot(px - ax, py - ay);
      const t = clamp((apx * abx + apy * aby) / abLen2, 0, 1);
      const cx = ax + abx * t;
      const cy = ay + aby * t;
      return Math.hypot(px - cx, py - cy);
    }

    function cubicPoint(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const tt = t * t;
      const uu = u * u;
      const uuu = uu * u;
      const ttt = tt * t;
      return {
        x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
        y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
      };
    }

    function distanceToCubicBezier(p0, p1, p2, p3, p) {
      const samples = 32;
      let best = Number.POSITIVE_INFINITY;
      let prev = cubicPoint(p0, p1, p2, p3, 0);
      for (let i = 1; i <= samples; i++) {
        const t = i / samples;
        const cur = cubicPoint(p0, p1, p2, p3, t);
        const d = distanceToSegment(p.x, p.y, prev.x, prev.y, cur.x, cur.y);
        if (d < best) best = d;
        prev = cur;
      }
      return best;
    }

    function findHoveredEdgeIndex(pointerX, pointerY) {
      if (!layout) return null;
      let bestIndex = null;
      let bestDistance = Number.POSITIVE_INFINITY;
      layout.edges.forEach((edge, edgeIndex) => {
        const points = edge.points.map(p => transformPoint(p.x, p.y));
        let distance = Number.POSITIVE_INFINITY;
        if (points.length >= 4) {
          distance = distanceToCubicBezier(points[0], points[1], points[2], points[3], { x: pointerX, y: pointerY });
        } else if (points.length >= 2) {
          for (let i = 0; i < points.length - 1; i++) {
            const d = distanceToSegment(pointerX, pointerY, points[i].x, points[i].y, points[i + 1].x, points[i + 1].y);
            if (d < distance) distance = d;
          }
        }
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = edgeIndex;
        }
      });
      return bestDistance <= 10 ? bestIndex : null;
    }

    function centerOnLeftmostNode() {
      if (!layout || !layout.nodes || layout.nodes.length === 0) {
        setViewInstant(1, 40, 40);
        return;
      }
      const leftmost = layout.nodes.reduce((best, node) => {
        if (!best) return node;
        if (node.x < best.x) return node;
        if (node.x === best.x && node.y < best.y) return node;
        return best;
      }, null);
      if (!leftmost) {
        setViewInstant(1, 40, 40);
        return;
      }
      const viewport = canvas.getBoundingClientRect();
      const initialZoom = 1;
      const initialPanX = viewport.width / 2 - leftmost.x * initialZoom;
      const initialPanY = viewport.height / 2 - leftmost.y * initialZoom;
      setViewInstant(initialZoom, initialPanX, initialPanY);
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (!layout) return;

      for (let edgeIndex = 0; edgeIndex < layout.edges.length; edgeIndex++) {
        const edge = layout.edges[edgeIndex];
        const isHovered = hoveredEdgeIndex === edgeIndex;
        ctx.strokeStyle = isHovered ? "#2196f3" : "rgba(136,136,136,0.6)";
        ctx.lineWidth = isHovered ? 3.5 : 1.8;
        const points = edge.points.map(p => transformPoint(p.x, p.y));
        if (points.length >= 4) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          ctx.bezierCurveTo(points[1].x, points[1].y, points[2].x, points[2].y, points[3].x, points[3].y);
          ctx.stroke();
        } else if (points.length >= 2) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
          ctx.stroke();
        }
      }

      for (const node of layout.nodes) {
        const center = transformPoint(node.x, node.y);
        const w = node.width * zoom;
        const h = node.height * zoom;
        const x = center.x - w / 2;
        const y = center.y - h / 2;

        ctx.fillStyle = "white";
        ctx.strokeStyle = "#cccccc";
        ctx.lineWidth = 1 * zoom;
        ctx.fillRect(x, y, w, h);
        ctx.strokeRect(x, y, w, h);

        const labelText = formatNodeLabel(node.id);
        const labelFontSize = clamp(20 * Math.sqrt(zoom), 6, 40);
        const labelY = y - 8;
        ctx.font = `${labelFontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        const labelWidth = ctx.measureText(labelText).width;
        const labelPadding = 6;
        ctx.fillStyle = "rgba(245,245,245,0.9)";
        ctx.fillRect(
          center.x - labelWidth / 2 - labelPadding,
          labelY - labelFontSize - 2,
          labelWidth + labelPadding * 2,
          labelFontSize + 4
        );
        ctx.fillStyle = "#212121";
        ctx.fillText(labelText, center.x, labelY);
        ctx.textAlign = "start";
        ctx.textBaseline = "alphabetic";
      }
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    async function uploadGraph() {
      const archive = zipArchiveInput.files?.[0];
      const graphName = graphNameInput.value.trim();
      if (!archive) {
        setStatus("Select a ZIP archive first.");
        return;
      }
      if (!graphName) {
        setStatus("Provide a graph name first.");
        return;
      }

      setStatus("Uploading graph...");
      const form = new FormData();
      form.append("graphName", graphName);
      form.append("archive", archive);
      const res = await fetch("/api/upload-graph", { method: "POST", body: form });
      const payloadText = await res.text();
      if (!res.ok) {
        setStatus(`Upload failed (${res.status}): ${payloadText}`);
        return;
      }
      const payload = JSON.parse(payloadText);
      await refreshGraphs(payload.graphId);
      setStatus(`Uploaded graphId: ${escapeHtml(payload.graphId)}`);
    }

    async function renderSelectedGraph() {
      const graphId = graphSelect.value;
      if (!graphId) {
        setStatus("Select a graph first.");
        return;
      }
      setStatus(`Rendering ${graphId}...`);
      const res = await fetch(`/api/layout/${encodeURIComponent(graphId)}`);
      if (!res.ok) {
        const body = await res.text();
        setStatus(`Layout failed (${res.status}): ${body}`);
        return;
      }
      layout = await res.json();
      hoveredEdgeIndex = null;
      centerOnLeftmostNode();
      draw();
      setStatus(`Rendered ${graphId}: ${layout.nodes.length} nodes, ${layout.edges.length} edges.`);
    }

    async function deleteSelectedGraph() {
      const graphId = graphSelect.value;
      if (!graphId) {
        setStatus("Select a graph first.");
        return;
      }
      if (!window.confirm(`Delete graph '${graphId}'?`)) return;
      setStatus(`Deleting ${graphId}...`);
      const res = await fetch(`/api/graph/${encodeURIComponent(graphId)}`, { method: "DELETE" });
      if (!res.ok) {
        const body = await res.text();
        setStatus(`Delete failed (${res.status}): ${body}`);
        return;
      }
      await refreshGraphs();
      layout = null;
      draw();
      setStatus(`Deleted ${graphId}.`);
    }

    uploadButton.addEventListener("click", () => uploadGraph().catch(e => setStatus(e.message)));
    refreshButton.addEventListener("click", () => refreshGraphs().then(() => setStatus("Graph list refreshed.")).catch(e => setStatus(e.message)));
    renderButton.addEventListener("click", () => renderSelectedGraph().catch(e => setStatus(e.message)));
    deleteButton.addEventListener("click", () => deleteSelectedGraph().catch(e => setStatus(e.message)));

    canvas.addEventListener("wheel", (e) => {
      if (!layout) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const scale = Math.exp(-e.deltaY * WHEEL_ZOOM_INTENSITY);
      applyZoomAtPoint(zoom * scale, mx, my);
    }, { passive: false });

    canvas.addEventListener("mousedown", (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.classList.add("dragging");
    });

    window.addEventListener("mouseup", () => {
      dragging = false;
      canvas.classList.remove("dragging");
    });

    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      setViewInstant(zoom, panX + dx, panY + dy);
      lastX = e.clientX;
      lastY = e.clientY;
      draw();
    });

    canvas.addEventListener("mousemove", (e) => {
      if (!layout || dragging) return;
      const rect = canvas.getBoundingClientRect();
      const pointerX = e.clientX - rect.left;
      const pointerY = e.clientY - rect.top;
      const nextHovered = findHoveredEdgeIndex(pointerX, pointerY);
      if (nextHovered !== hoveredEdgeIndex) {
        hoveredEdgeIndex = nextHovered;
        draw();
      }
    });

    canvas.addEventListener("mouseleave", () => {
      if (hoveredEdgeIndex !== null) {
        hoveredEdgeIndex = null;
        draw();
      }
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    refreshGraphs().then(() => setStatus("Ready.")).catch(e => setStatus(e.message));
  </script>
</body>
</html>
